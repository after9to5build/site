<!doctype html>
<!-- Sumber meta image (1200x630). Render ulang: lihat render.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0E0E0E;}
  .wrap{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;color:#E5E2E1;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased;}
  .mark{font-size:34px;font-weight:600;letter-spacing:-0.015em;}
  .mark span{color:#39FF88;}
  h1{margin:0 0 22px;font-size:84px;line-height:1.05;font-weight:600;letter-spacing:-0.035em;}
  p{margin:0;font-size:30px;line-height:1.4;font-weight:500;letter-spacing:-0.01em;color:#8E8E8E;}
  .row{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:24px;color:#8E8E8E;}
  .row b{font-weight:400;color:#5A5A5A;margin-right:10px;}
  .tags span{margin-right:36px;}
  .live{color:#E5E2E1;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#39FF88;margin-right:12px;vertical-align:middle;position:relative;top:-2px;}
</style></head>
<body><div class="wrap">
  <div class="mark">after9to5<span>build</span></div>
  <div>
    <h1>Real things, built with AI.</h1>
    <p>Games, tools, and automations you can actually use.<br>Built after 9 to 5.</p>
  </div>
  <div class="row">
    <div class="tags"><span><b>/</b>games</span><span><b>/</b>tools</span><span><b>/</b>automations</span></div>
    <div class="live"><span class="dot"></span>free to try</div>
  </div>
</div></body></html>
