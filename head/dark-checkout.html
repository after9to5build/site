<!-- after9to5build: tema gelap buat halaman produk lynk.id (latar + Checkout Form).
     Tempel ke: Landing page > Settings > Custom Head Script (nyalain toggle-nya).
     Nempel ke kelas bawaan lynk (.lp-checkout dll). Kalau suatu saat lynk ganti tampilan, cek ulang. -->
<style>
  /* Latar halaman + kolom */
  main, main > .max-w-2xl { background:#0A0A0A !important; }

  /* Variabel bawaan form: aksen hijau, garis gelap */
  .lp-checkout, .lp-checkout-modal {
    --co-green:#39FF88; --co-mint:rgba(57,255,136,.10); --co-border:#262626; --co-accent-fg:#0A0A0A;
    color:#EDEDED;
  }

  /* Teks */
  .lp-checkout h3, .lp-checkout h4, .lp-checkout label, .lp-checkout p, .lp-checkout span,
  .lp-checkout-modal h3, .lp-checkout-modal h4, .lp-checkout-modal label, .lp-checkout-modal p, .lp-checkout-modal span { color:#EDEDED !important; }
  .lp-checkout .text-gray-500, .lp-checkout .text-gray-600, .lp-checkout [class*="text-[#666]"], .lp-checkout [class*="text-[#6B7280]"] { color:#8A8A8A !important; }

  /* Kotak putih -> kartu gelap */
  .lp-checkout .bg-white, .lp-checkout .lp-checkout-card, .lp-checkout .lp-co-cc-btn,
  .lp-checkout-modal .bg-white { background:#121212 !important; border-color:#262626 !important; }
  .lp-checkout .lp-checkout-card.is-selected { border-color:#39FF88 !important; }

  /* Kolom isian */
  .lp-checkout input:not([type="checkbox"]):not([type="radio"]), .lp-checkout textarea, .lp-checkout select,
  .lp-checkout-modal input:not([type="checkbox"]):not([type="radio"]) {
    background:#0E0E0E !important; color:#EDEDED !important; border-color:#262626 !important;
  }
  .lp-checkout input::placeholder, .lp-checkout textarea::placeholder { color:#555 !important; }
  .lp-checkout input:focus, .lp-checkout textarea:focus { border-color:#39FF88 !important; outline:none !important; }

  /* Tombol kecil (qty, voucher) + link */
  .lp-checkout button.rounded-md { background:#1A1A1A !important; color:#EDEDED !important; }
  .lp-checkout div:has(> button.rounded-md) { background:#0E0E0E !important; border-color:#262626 !important; }
  .lp-checkout .lp-co-voucher-add { color:#EDEDED !important; border-color:#262626 !important; }
  .lp-checkout a { color:#39FF88 !important; }

  /* Tombol utama tetap hijau, teksnya hitam */
  .lp-checkout .lp-checkout-submit-label, .lp-checkout .lp-checkout-submit-label * { color:#0A0A0A !important; }
</style>
